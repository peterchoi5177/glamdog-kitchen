<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8772e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="양양 주방">
<title>글램독 양양 주방 가이드</title>
<style>
:root{--acc:#e8772e;--acc2:#fff3ea;--ink:#1f1f1f;--sub:#6b6b6b;--line:#ebe5de;--bg:#f7f4f0;--ok:#2f8f5b;--warn:#c0392b;--nav:62px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.5;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 span{color:var(--acc)}
select{font-size:15px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:6px 10px;font-size:14px;cursor:pointer;color:var(--sub)}
.seg button.on{background:var(--acc);color:#fff;font-weight:700}
nav.bottom{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:flex;z-index:10}
nav.bottom button{flex:1;border:0;background:none;font-size:11.5px;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
nav.bottom button i{font-style:normal;font-size:21px;line-height:1}
nav.bottom button.on{color:var(--acc);font-weight:700}
main{max-width:860px;margin:0 auto;padding:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.muted{color:var(--sub);font-size:13.5px}
h2.sec{font-size:16px;margin:18px 4px 8px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}h2.sec .muted{font-weight:400;font-size:12.5px}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.datebar button{border:1px solid var(--line);background:#fff;border-radius:12px;width:44px;height:44px;font-size:20px;cursor:pointer}
.datebar .d{flex:1;text-align:center}
.datebar .d b{font-size:20px;display:block}
.meals{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:760px){.meals{grid-template-columns:repeat(3,1fr)}}
.meal h3{margin:0 0 6px;font-size:14px;color:var(--sub);font-weight:600}
.meal .main{font-size:21px;font-weight:800;margin-bottom:6px}
.chip{display:inline-block;background:var(--acc2);color:#a24c12;border-radius:999px;padding:5px 12px;font-size:14px;margin:3px 4px 3px 0;cursor:pointer;border:1px solid #f6d6bf}
.chip.g{background:#f1f5f2;color:#2f6b4a;border-color:#d6e6dc}
.chip.off{background:#fff;color:var(--sub);border-color:var(--line)}
.rlink{cursor:pointer;text-decoration:underline;text-decoration-color:#f0b48a;text-underline-offset:4px}
.todo{border-left:5px solid var(--acc)}
.todo ul{padding-left:18px;margin:6px 0 0}.todo li{margin:5px 0}
.weeks{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.weeks .chip{white-space:nowrap;flex:none}
.days{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:760px){.days{grid-template-columns:repeat(2,1fr)}}
.day{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.day.today{border:2px solid var(--acc);background:#fffaf6}
.day .dh{display:flex;justify-content:space-between;font-weight:700;margin-bottom:4px}
.day .row{display:flex;gap:8px;padding:3px 0;font-size:15px}
.day .row .lb{width:34px;color:var(--sub);font-size:13px;padding-top:2px;flex:none}
.day .m1{font-weight:700;cursor:pointer}
.day .m2{color:var(--sub);cursor:pointer;font-size:14px}
.printonly{display:none}
.mt{border-collapse:collapse;width:100%;table-layout:fixed}
.mt th,.mt td{border:1px solid #ccc;padding:4px;vertical-align:top;font-size:12.5px}
.mt th{background:#f3eee8}
.mt .m2{color:#555;font-size:11.5px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.rc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.rc b{font-size:16px}
.filters{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.filters input{flex:1 1 100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin-top:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:18px 18px 0 0;max-width:680px;width:100%;max-height:92vh;overflow:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom));position:relative}
@media(min-width:760px){.modal{align-items:center}.mbox{border-radius:18px}}
.mbox h2{margin:0 36px 2px 0;font-size:22px}
.x{position:absolute;right:10px;top:8px;font-size:28px;border:0;background:none;cursor:pointer;width:44px;height:44px}
.ing{padding-left:18px;columns:2;column-gap:18px}
.ing li{break-inside:avoid;margin:2px 0}
.steps{padding-left:22px}.steps li{margin:10px 0;font-size:17px}
.thaw{background:#eef6ff;border:1px solid #cfe3fb;border-radius:10px;padding:8px 10px;font-size:14px;margin:10px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:8px 12px;text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer}
.btn.ghost{background:#fff;color:var(--acc);border:1px solid var(--acc)}
.btn.gray{background:#f1eee9;color:#444}
.btn.big{width:100%;padding:14px;font-size:17px;border-radius:12px}
.note{background:#fffbe6;border:1px solid #f3e3a1;border-radius:12px;padding:10px 12px;font-size:14px}
.it{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.it.sel{border-color:#f0b48a;background:#fffaf6}
.it.zero{opacity:.75}
.it .top{display:flex;gap:10px;align-items:flex-start}
.it .top input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--acc);flex:none}
.it .nm{flex:1;font-weight:700;font-size:15px;line-height:1.35}
.it .pr{text-align:right;font-weight:700;white-space:nowrap}
.it .pr small{display:block;font-weight:400;color:var(--sub);font-size:12px}
.it .bot{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{border:0;background:#f6f2ed;width:34px;height:34px;font-size:20px;cursor:pointer}
.step input{width:50px;height:34px;border:0;text-align:center;font-size:16px;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.unit{font-size:13px;color:var(--sub);margin-right:4px}
.need{font-size:13px;color:var(--sub);flex:1 1 100%;order:9}
.need b{color:var(--ink)}
.sumbar{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));background:#2b2622;color:#fff;z-index:9;padding:8px 12px;display:flex;align-items:center;gap:8px}
.sumbar .t{flex:1;font-size:14px;line-height:1.3}.sumbar .t b{font-size:17px}
.sumbar .btn.gray{background:#4a433d;color:#fff}
.pad-sum{height:64px}
.sum3{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.sum3{grid-template-columns:repeat(3,1fr)}}
.big{font-size:27px;font-weight:800}
.bar{height:10px;background:#eee;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.ok{color:var(--ok)}.warn{color:var(--warn)}
.bt{width:100%;border-collapse:collapse}.bt td{padding:6px 2px;border-bottom:1px solid var(--line);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:40;font-size:14px;display:none}
.prog li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.prog li.done span{text-decoration:line-through;color:var(--sub)}
.prog{list-style:none;padding:0;margin:8px 0}
@media print{header,nav.bottom,.sumbar,.noprint{display:none!important}body{background:#fff;padding:0}main{max-width:none;padding:0}.screenonly{display:none!important}.printonly{display:block}.pb{page-break-after:always}.mt th,.mt td{font-size:15px;padding:8px 6px}.mt .m2{font-size:13px}.printonly h3{font-size:20px;margin:6px 0}}
</style>
</head>

<script>
const DATA = {"anchor":"2026-10-19","priceDate":"2026-10-17","basePeople":7,"breakfast":{"A":{"ko":"시리얼 + 우유 (+바나나·과일 있으면)","en":"Cereal + milk"},"B":{"ko":"토스트 + 잼 + 계란후라이 + 우유","en":"Toast + jam + fried egg + milk"},"D":{"ko":"토스트(냉동빵) + 잼 + 우유","en":"Toast + jam + milk"},"B2":{"ko":"토스트(냉동빵) + 잼 + 계란후라이 + 우유","en":"Toast + jam + fried egg + milk"},"none":{"ko":"-","en":"-"}},"breakfastPattern":["A","B","A","B","A","B","A"],"menu":[[[["kimchibap"],["jeyuk","kongnamulguk"]],[["chamchimayo","gyeranguk"],["doenjang","gyeranmari"]],[["curry"],["dakbokkeum","cabbagesalad"]],[["bibimbap","miyeokguk"],["kimchijjigae","eomukbokkeum"]],[["jjajang","gyeranguk"],["bbq","doenjang"]],[["tteokbokki"],["bulgogi","miyeokguk"]],[["manduguk"],["mapa","gamjabokkeum"]]],[[["spamegg","miyeokguk"],["jjimdak"]],[["bibimbap","eomukguk"],["kimchijjigae","gamjabokkeum"]],[["kimchibap"],["jeyuk","kongnamulguk"]],[["curry_chicken"],["doenjang","sausage"]],[["chamchimayo","eomukguk"],["dakgalbi"]],[["budae"],["gyeranmari","eomukbokkeum","kongnamulguk"]],[["manduguk"],["bulgogi","cabbagesalad"]]],[[["bibimbap","miyeokguk"],["kimchisamgyeop","kongnamulguk"]],[["spamegg","eomukguk"],["kimchijjigae","gyeranmari"]],[["kimchibap"],["dakbokkeum","gamjabokkeum"]],[["curry"],["doenjang","eomukbokkeum"]],[["chamchimayo","miyeokguk"],["bbq","doenjang"]],[["tteokbokki"],["sausage","hobakbokkeum","gyeranguk"]],[["jjajang","gyeranguk"],["mapa","cabbagesalad"]]],[[["kimchibap"],["jeyuk","miyeokguk"]],[["bibimbap","eomukguk"],["jjimdak"]],[["chamchimayo","gyeranguk"],["kimchijjigae","gamjabokkeum"]],[["budae"],["doenjang","gyeranmari"]],[["jjajang","kongnamulguk"],["dakgalbi"]],[["manduguk"],["kimchijjigae","hobakbokkeum"]],[["spamegg","miyeokguk"],["gyeranmari","sausage","eomukguk"]]]],"en":{"돼지 앞다리 슬라이스":"Sliced pork shoulder","찌개용 돼지고기":"Pork chunks (stew cut)","닭다리살":"Boneless chicken thigh","삼겹살":"Pork belly","돼지 다짐육":"Ground pork","양파":"Onion","양배추":"Cabbage","대파(냉동)":"Green onion (frozen)","당근":"Carro 게 채, 당근은 얇게 썬다.","큰 팬 센 불에서 고기 7분 볶는다 (기름 따로 안 넣어도 됨).","양파·당근 넣고 4분, 대파 넣고 1분. 끝."],"en_steps":["Mix pork with soy sauce, sugar, garlic, sesame oil, pepper. Rest 10 min.","Slice onion thick, carrot thin.","Stir-fry pork on HIGH heat 7 min (no extra oil needed).","Add onion and carrot 4 min, green onion 1 min. Done."]},"kimchijjigae":{"ko":"김치찌개","en":"Kimchi Stew","type":"main","min":30,"thaw":"찌개용 돼지고기 400g","ing":[["김치",1000,"g"],["찌개용 돼지고기",400,"g"],["두부",500,"g"],["양파",1,"개"],["대파(냉동)",1,"컵"],["고춧가루",2,"큰술"],["다진마늘",1,"큰술"],["설탕",1,"큰술"],["식용유",1,"큰술"],["물",2,"L"]],"ko_steps":["큰 냄비에 기름, 고기 넣고 3분 → 김치 넣고 5분 볶는다.","물 2L, 고춧가루·마늘·설탕 넣고 뚜껑 덮고 20분 끓인다.","두부(주사위 크기)·양파 넣고 5분.","대파 넣고 끝. 싱거우면 김치국물이나 소금 조금."],"en_steps":["In a big pot: oil + pork 3 min, then kimchi 5 min.","Add 2L water, pepper flakes, garlic, sugar. Lid on, boil 20 min.","Add tofu (dice) and onion, 5 min.","Add green onion. If bland, add kimchi juice or a little salt."]},"doenjang":{"ko":"된장찌개","en":"Soybean Paste Stew","type":"main","min":25,"ing":[["된장",5,"큰술"],["고추장",1,"큰술"],["감자",2,"개"],["애호박",1,"개"],["양파",1,"개"],["두부",500,"g"],["대파(냉동)",1,"컵"],["다진마늘",1,"큰술"],["물",2,"L"]],"ko_steps":["물 2L에 된장·고추장을 풀고, 깍둑 썬 감자를 넣어 10분 끓인다.","애호박·양파·두부(주사위 크기) 넣고 7분.","마늘·대파 넣고 2분. 끝."],"en_steps":["Dissolve doenjang + gochujang in 2L water. Add diced potato, boil 10 min.","Add zucchini, onion, tofu (dice). 7 min.","Add garlic and green onion, 2 min. Done."]},"dakbokkeum":{"ko":"닭볶음탕","en":"Spicy Braised Chicken","type":"main","min":45,"thaw":"닭다리살 1.6kg","ing":[["닭다리살",1600,"g"],["감자",4,"개"],["당근",1,"개"],["양파",2,"개"],["대파(냉동)",1,"컵"],["고추장",4,"큰술"],["고춧가루",4,"큰술"],["간장",6,"큰술"],["설탕",3,"큰술"],["다진마늘",2,"큰술"],["물",1,"L"]],"ko_steps":["닭은 큼직하게(한입의 2배), 감자·당근도 큼직하게 자른다.","냄비에 닭 + 물 + 양념 모두 넣고 센 불. 끓으면 중불로 15분.","감자·당근 넣고 15분 (감자에 젓가락이 쏙 들어가면 OK).","양파·대파 넣고 5분. 끝."],"en_steps":["Cut chicken big (2 bites), potato and carrot big too.","Pot: chicken + water + all sauce. Boil, then MEDIUM 15 min.","Add potato and carrot in, stir 5 min (don't let it burn)."]},"curry_chicken":{"ko":"카레라이스 (닭)","en":"Curry Rice (chicken)","type":"main","min":35,"thaw":"닭다리살 800g","ing":[["닭다리살",800,"g"],["감자",4,"개"],["당근",1,"개"],["양파",3,"개"],["카레가루",250,"g"],["식용유",2,"큰술"],["물",2.2,"L"]],"ko_steps":["닭·감자·당근·양파를 주사위 크기로 썬다.","냄비에 기름, 닭 4분 → 채소 넣고 3분 볶는다.","물 넣고 15분 끓인다.","불을 약하게. 카레가루를 찬물 2컵에 풀어 넣고 5분 저어준다."],"en_steps":["Dice chicken, potato, carrot, onion.","Pot + oil: chicken 4 min, vegetables 3 min.","Add water, boil 15 min.","LOW heat. Mix curry powder in 2 cups cold water, pour in, stir 5 min."]},"jjajang":{"ko":"짜장밥","en":"Black Bean Sauce Rice","type":"main","min":35,"thaw":"찌개용 돼지고기 300g","ing":[["찌개용 돼지고기",300,"g"],["양파",3,"개"],["감자",2,"개"],["양배추",300,"g"],["짜장가루",250,"g"],["식용유",3,"큰술"],["물",2,"L"]],"ko_steps":["고기·양파·감자·양배추를 주사위 크기로 썬다.","냄비에 기름, 고기 3분 → 채소 넣고 5분 볶는다.","물 넣고 12분 끓인다.","불을 약하게. 짜장가루를 찬물 2컵에 풀어 넣고 5분 저어준다."],"en_steps":["Dice pork, onion, potato, cabbage.","Pot + oil: pork 3 min, vegetables 5 min.","Add water, boil 12 min.","LOW heat. Mix jjajang powder in 2 cups cold water, pour in, stir 5 min."]},"kimchibap":{"ko":"김치볶음밥 + 계란후라이","en":"Kimchi Fried Rice + Egg","type":"main","min":20,"ing":[["밥",7,"공기"],["김치",600,"g"],["런천미트",300,"g"],["대파(냉동)",1,"컵"],["계란",7,"개"],["고춧가루",1,"큰술"],["간장",2,"큰술"],["설탕",1,"큰술"],["참기름",1,"큰술"],["식용유",3,"큰술"]],"ko_steps":["김치·햄을 잘게 썬다.","큰 팬에 기름 + 대파 1분 → 햄 2분 → 김치·설탕·고춧가루 3분 볶는다.","밥·간장 넣고 5분 골고루 볶는다 (팬이 작으면 2번 나눠서). 참기름 둘러 마무리.","계란후라이 7개 올리면 끝."],"en_steps":["Chop kimchi and ham small.","Big pan + oil: green onion 1 min, ham 2 min, kimchi + sugar + flakes 3 min.","Add rice + soy sauce, mix-fry 5 min (2 batches if pan is small). Sesame oil.","Top with 7 fried eggs. Done."]},"chamchimayo":{"ko":"참치마요덮밥","en":"Tuna Mayo Rice Bowl","type":"main","min":15,"ing":[["밥",7,"공기"],["참치",450,"g"],["마요네즈",7,"큰술"],["간장",2,"큰술"],["설탕",1,"큰술"],["계란",7,"개"],["김(도시락김)",4,"봉"]],"ko_steps":["참치 기름을 꼭 짜고, 마요·간장·설탕과 섞는다.","계란을 풀어 소금 조금, 팬에서 스크램블.","밥 위에 계란 → 참치마요 → 부순 김. 끝."],"en_steps":["Squeeze oil out of tuna. Mix with mayo, soy sauce, sugar.","Beat eggs with a pinch of salt, scramble in a pan.","Rice -> egg -> tuna mayo -> crushed seaweed. Done."]},"spamegg":{"ko":"햄 계란덮밥","en":"Spam & Egg Rice Bowl","type":"main","min":15,"ing":[["밥",7,"공기"],["런천미트",450,"g"],["계란",10,"개"],["양파",1,"개"],["간장",4,"큰술"],["설탕",2,"큰술"],["물",100,"ml"],["김(도시락김)",3,"봉"]],"ko_steps":["햄을 깍둑 썰어 팬에서 노릇하게 5분 굽는다.","양파 넣고 2분 → 간장·설탕·물 넣고 2분.","계란을 풀어 부어 살짝만 익힌다 (1~2분, 너무 젓지 않기).","밥 위에 올리고 김 부숴 올리기."],"en_steps":["Dice ham, pan-fry until golden 5 min.","Add onion 2 min, then soy, sugar, water 2 min.","Pour beaten eggs, cook gently 1-2 min (don't over-stir).","Serve on rice, top with crushed seaweed."]},"budae":{"ko":"부대찌개","en":"Army Stew","type":"main","min":25,"ing":[["런천미트",400,"g"],["비엔나소시지",300,"g"],["김치",400,"g"],["두부",300,"g"],["양파",1,"개"],["떡볶이떡",300,"g"],["대파(냉동)",1,"컵"],["라면사리(선택)",2,"개"],["고춧가루",3,"큰술"],["고추장",1,"큰술"],["간장",2,"큰술"],["다진마늘",2,"큰술"],["설탕",1,"큰술"],["물",2,"L"]],"ko_steps":["넓은 냄비에 햄·소시지·김치·두부·양파·떡을 둘러 담는다.","양념을 가운데 올리고 물 2L 붓는다.","센 불에 15분 끓인다. 라면 넣으면 3분 더. 대파 올려 끝."],"en_steps":["Arrange ham, sausage, kimchi, tofu, onion, rice cakes in a wide pot.","Put all sauce in the middle, pour 2L water.","HIGH heat 15 min. Ramen? +3 min. Add green onion. Done."]},"tteokbokki":{"ko":"떡볶이 + 만두","en":"Spicy Rice Cakes + Dumplings","type":"main","min":25,"ing":[["떡볶이떡",1200,"g"],["어묵",500,"g"],["양배추",300,"g"],["대파(냉동)",1,"컵"],["계란",7,"개"],["물만두(선택)",300,"g"],["고추장",6,"큰술"],["고춧가루",3,"큰술"],["설탕",6,"큰술"],["간장",3,"큰술"],["물",1.2,"L"]],"ko_steps":["계란은 12분 삶아 껍질 깐다. 떡은 물에 한번 헹군다.","냄비에 물 + 양념 넣고 끓인다.","떡·어묵·양배추 넣고 10분, 계속 저어준다.","계란·대파 넣고 2분. 만두가 있으면 데워서 곁들인다."],"en_steps":["Boil eggs 12 min, peel. Rinse rice cakes.","Pot: water + all sauce, bring to boil.","Add rice cakes, fish cake, cabbage. 10 min, keep stirring.","Add eggs + green onion 2 min. Dumplings on the side if you have them."]},"manduguk":{"ko":"만두국","en":"Dumpling Soup","type":"main","min":20,"ing":[["물만두",1000,"g"],["계란",4,"개"],["대파(냉동)",1,"컵"],["간장",3,"큰술"],["다진마늘",1,"큰술"],["소금",1,"작은술"],["물",3,"L"],["김(도시락김)",2,"봉"]],"ko_steps":["물 3L 끓으면 간장·마늘·소금 넣는다.","만두 넣고, 떠오르면 3분 더.","계란을 풀어 둘러 붓고 젓지 말고 1분. 대파.","그릇에 담고 김 부숴 올리기."],"en_steps":["Boil 3L water, add soy sauce, garlic, salt.","Add dumplings. When they float, 3 more min.","Pour beaten eggs around, DON'T stir, 1 min. Green onion.","Serve, top with crushed seaweed."]},"mapa":{"ko":"마파두부덮밥","en":"Mapo Tofu Rice","type":"main","min":25,"thaw":"돼지 다짐육 500g","ing":[["돼지 다짐육",500,"g"],["두부",1500,"g"],["대파(냉동)",1,"컵"],["다진마늘",2,"큰술"],["고추장",2,"큰술"],["고춧가루",2,"큰술"],["간장",4,"큰술"],["설탕",1,"큰술"],["물",600,"ml"],["감자전분",3,"큰술"],["식용유",3,"큰술"]],"ko_steps":["두부는 주사위 크기로 썬다. 전분 3큰술을 물 6큰술에 풀어 둔다.","팬에 기름 + 대파·마늘 1분 → 고기 5분 볶는다.","고추장·고춧가루·간장·설탕·물 넣고 끓으면 두부 넣고 5분.","전분물 넣고 저어서 걸쭉해지면(1분) 끝. 밥 위에."],"en_steps":["Dice tofu. Mix 3 Tbsp starch with 6 Tbsp water.","Pan + oil: green onion + garlic 1 min, pork 5 min.","Add gochujang, flakes, soy, sugar, water. Boil, add tofu, 5 min.","Pour starch water, stir until thick (1 min). Serve on rice."]},"bbq":{"ko":"삼겹살 구이","en":"Pan-fried Pork Belly","type":"main","min":40,"thaw":"삼겹살 1.8kg","ing":[["삼겹살",1800,"g"],["양배추",300,"g"],["쌈장",1,"통"],["김치",400,"g"],["양파",1,"개"],["소금",1,"작은술"],["후추",0.5,"작은술"]],"ko_steps":["큰 팬을 달궈 삼겹살을 앞뒤 노릇하게 굽는다 (한 번에 다 안 들어가면 2~3번 나눠서). 소금·후추.","양배추는 한 장씩 떼어 쌈용으로, 양파는 얇게 썬다.","기름 나온 팬에 김치도 같이 굽는다. 쌈장과 같이.","된장찌개를 같이 끓인다."],"en_steps":["Heat a big pan, fry pork belly until golden both sides (2-3 batches). Salt + pepper.","Cabbage leaves for wraps, slice onion thin.","Fry kimchi in the pork fat. Serve with ssamjang.","Make Doenjang stew on the side."]},"kimchisamgyeop":{"ko":"김치삼겹볶음","en":"Kimchi Pork Belly Stir-fry","type":"main","min":25,"thaw":"삼겹살 1.2kg","ing":[["삼겹살",1200,"g"],["김치",800,"g"],["양파",2,"개"],["대파(냉동)",1,"컵"],["고춧가루",1,"큰술"],["설탕",2,"큰술"],["간장",1,"큰술"]],"ko_steps":["삼겹살을 한입 크기로 잘라 팬에서 7분 굽는다 (기름 많으면 조금 덜어내기).","김치·설탕·고춧가루·간장 넣 function vRecipes(){const en=S.lang==='en';const ids=Object.keys(DATA.recipes).filter(id=>(S.rf==='all'||R(id).type===S.rf)&&(!S.q||(R(id).ko+R(id).en).toLowerCase().includes(S.q.toLowerCase())));
 let h=`<div class="filters">${['all','main','soup','side'].map(k=>`<span class="chip ${S.rf===k?'':'off'}" onclick="S.rf='${k}';render()">${t(k)}</span>`).join('')}<input placeholder="🔍 ${t('search')}" value="${S.q}" oninput="S.q=this.value;render(true)"></div>`;
 h+=`<div class="rgrid">${ids.map(id=>{const r=R(id);return `<div class="rc" onclick="openRecipe('${id}')"><b>${id.startsWith('s_')?'🧊 ':''}${en?r.en:r.ko}</b><div class="muted">${t(r.type)} · ⏱ ${r.min}${t('min')}${r.thaw?' · ❄️':''}</div></div>`}).join('')}</div>`;
 return h;}
/* ---------- 재고 & 주문 ---------- */
function getStock(){try{const s=JSON.parse(LS.gd_stock||'null');if(s&&s.v)return s;}catch(e){}return JSON.parse(JSON.stringify(DATA.stock0));}
function saveStock(s){s.date=new Date().toISOString().slice(0,10);LS.gd_stock=JSON.stringify(s);}
function getSel(){try{return JSON.parse(LS.gd_sel||'{}')}catch(e){return {}}}
function saveSel(s){LS.gd_sel=JSON.stringify(s);}
const O=id=>DATA.order.find(o=>o.id===id);
function visible(o){return o.g!=='local';}
let _mn=null,_mnk='';
function MN(){const k=dkey(new Date())+'|'+S.people;if(_mnk===k)return _mn;const need={};const f=F();let d=new Date(Date.now()+2*864e5),cnt=0,g=0;
 while(cnt<DATA.windowDays&&g<40){g++;const m=mealsOf(d);if(!m.sp){cnt++;for(const meal of [m.l,m.di]){if(!meal)continue;need.kimchi=(need.kimchi||0)+DATA.sideKimchi*7*f;for(const r of meal)for(const [n,q] of R(r).ing){const mp=DATA.ingMap[n];if(mp)need[mp[0]]=(need[mp[0]]||0)+q*mp[1]*f;}}if(m.bf==='B'||m.bf==='B2')need.egg=(need.egg||0)+7*f;}d=new Date(d.getTime()+864e5);}
 _mn=need;_mnk=k;return need;}
function calc(o,stock){const s=stock.v[o.id];if(o.g==='ask')return {need:0,buy:s==='ok'?0:1};if(o.g==='opt')return {need:o.mon,buy:0};
 const need=o.byMenu?(MN()[o.id]||0):o.mon*F()*o.h/30;if(s==='ok')return {need,buy:0};const sh=need-(+s||0);return {need,buy:sh<=0?0:Math.max(0,Math.ceil(sh/o.pack-DATA.tol))};}
function rows(){const st=getStock(),sel=getSel();return DATA.order.filter(visible).map(o=>{const c=calc(o,st);const chosen=(o.id in sel)?sel[o.id]:c.buy>0;const cnt=chosen?Math.max(1,c.buy):0;return {o,c,chosen,cnt,cost:cnt*o.price};});}
function totals(rs){const ch=rs.filter(r=>r.chosen);const sum=ch.reduce((a,r)=>a+r.cost,0);const ship=ch.reduce((a,r)=>a+(r.o.ship||0),0);return {n:ch.length,sum,ship};}
const fx=v=>(Math.round(v*10)/10).toString();
const G={'frz':['🧊 냉동','다음 배송까지 1주일 식단에 필요한 만큼만'],'fri':['❄️ 냉장','1주일 치만'],'room':['📦 실온','쌀·우유·채소는 2주, 캔·시리얼은 한 달'],'ask':['🧂 양념','떨어진 것만 "떨어짐"으로'],'opt':['선택','아끼려면 빼도 되는 것']};
const grp=o=>o.g==='buy'?o.st:o.g;
function itemCard(r,st){const o=r.o,s=st.v[o.id];let h=`<div class="it ${r.chosen?'sel':''} ${r.c.buy===0&&!r.chosen?'zero':''}"><div class="top"><input type="checkbox" ${r.chosen?'checked':''} onchange="pick('${o.id}',this.checked)"><div class="nm">${o.name}${o.note?`<div class="muted" style="font-weight:400">${o.note}</div>`:''}</div><div class="pr">${r.cnt?won(r.cost):'-'}<small>${r.cnt?r.cnt+'개':'안 사도 됨'}${o.ship&&r.cnt?' +배송비':''}</small></div></div><div class="bot">`;
 if(o.g==='ask'){h+=`<span class="chip ${s==='ok'?'g':'off'}" onclick="setS('${o.id}','ok')">있음</span><span class="chip ${s!=='ok'?'':'off'}" onclick="setS('${o.id}',0)">떨어짐</span>`;}
 else if(o.g!=='opt'){const ok=s==='ok';h+=`<span class="unit">재고</span><span class="step"><button onclick="bump('${o.id}',-1)">−</button><input type="number" inputmode="decimal" value="${ok?'':fx(+s||0)}" placeholder="${ok?'충분':'0'}" onchange="setS('${o.id}',this.value===''?0:+this.value)"><button onclick="bump('${o.id}',1)">+</button></span><span class="unit">${o.unit}</span><span class="chip ${ok?'g':'off'}" onclick="setS('${o.id}',${ok?0:"'ok'"})">${ok?'✓ 충분':'충분'}</span><div class="need">${o.byMenu?'다음 배송까지 식단에':(o.h===7?'1주':o.h===14?'2주':'한 달')} 필요 <b>${fx(r.c.need)}${o.unit}</b> · 1개 = ${fx(o.pack)}${o.unit}</div>`;}
 h+=`${o.url?`<a class="btn ghost" style="margin-left:auto" target="_blank" href="https://www.coupang.com/vp/products/${o.url}" onclick="markOpened('${o.id}')">쿠팡</a>`:''}</div></div>`;return h;}
function vOrder(){const st=getStock();const rs=rows();
 let h=`<div class="card"><b>🛒 매주 월요일 주문</b><div class="muted" style="margin-top:4px">냉장고가 넘치지 않게 냉장·냉동은 <b>다음 배송까지 식단에 쓰는 만큼만</b> 사요.<br>1) 냉장고 보고 재고 입력 → 2) 부족한 것만 자동 체크 → 3) 아래 <b>담기</b></div>

 <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><span class="muted" style="flex:1;align-self:center">재고 기준일: <b>${st.date}</b>${st.date==='2026-10-21'&&!LS.gd_stock?'<br>(임시 식단 쓰고 남을 예상 재고)':''}</span><button class="btn gray" onclick="shareStock()">재고 공유 링크</button><button class="btn gray" onclick="resetStock()">재고 지우기</button></div></div>`;
 for(const g of ['frz','fri','room','ask','opt']){const list=rs.filter(r=>grp(r.o)===g);if(!list.length)continue;const sub=list.filter(r=>r.chosen).reduce((a,r)=>a+r.cost,0);
  h+=`<h2 class="sec"><span>${G[g][0]} <span class="muted">${G[g][1]}</span></span><span style="font-size:14px;white-space:nowrap">${won(sub)}</span></h2>`+list.map(r=>itemCard(r,st)).join('');}
 const loc=DATA.order.filter(o=>o.g==='local');
 h+=`<h2 class="sec">④ 양양 마트 <span class="muted" style="font-weight:400">매주</span></h2><div class="card">${loc.map(o=>`<div>• ${o.name}<div class="muted">${o.note}</div></div>`).join('')}</div>`;
 h+=`<p class="muted">가격은 ${DATA.priceDate} 쿠팡 기준이라 조금씩 바뀌어요. 품절이면 100g당 가격이 비슷한 같은 종류로.</p><div class="pad-sum"></div>`;
 return h;}
function sumbar(){const el=document.getElementById('sumbar');if(S.tab!=='order'){el.innerHTML='';return;}const tt=totals(rows());const allOn=rows().filter(r=>r.c.buy>0).every(r=>r.chosen);
 const ld=s=>Math.round(rows().filter(r=>r.chosen&&r.o.st===s&&!r.o.sep).reduce((a,r)=>a+r.cnt*r.o.pack*(r.o.kg||1),0));el.innerHTML=`<div class="sumbar"><div class="t">${tt.n}개 · <b>${won(tt.sum+tt.ship)}</b><br><span style="font-size:12px;opacity:.8">🧊냉동 ${ld('frz')}kg · ❄️냉장 ${ld('fri')}kg${tt.ship?' · 배송비 포함':''}</span></div><button class="btn gray" onclick="selAll(${!allOn})">${allOn?'전체 해제':'전체 선택'}</button><button class="btn" onclick="openCart()">담기 ▶</button></div>`;}
function pick(id,v){const s=getSel();s[id]=v;saveSel(s);render(true);}
function setS(id,v){const st=getStock();st.v[id]=v;saveStock(st);const s=getSel();delete s[id];saveSel(s);render(true);}
function bump(id,d){const st=getStock();const o=O(id);let v=st.v[id]==='ok'?0:(+st.v[id]||0);v=Math.max(0,Math.round((v+d*(o.step||1))*100)/100);setS(id,v);}
function setMode(m){S.mode=m;LS.gd_mode=m;render();}
function selAll(on){const s=getSel();rows().forEach(r=>{if(on){if(r.c.buy>0)s[r.o.id]=true;}else s[r.o.id]=false;});saveSel(s);render(true);toast(on?'살 것 전체 선택':'전체 해제');}
function resetStock(){if(!confirm('재고를 모두 0으로 지울까요?'))return;saveStock({v:{}});saveSel({});render();}
function shareStock(){const st=getStock();const url=location.origin+location.pathname+'#s='+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(st)))));copy(url,'재고 링크 복사됨. 카톡에 붙여넣어 보내세요');}
function copy(txt,msg){const done=()=>toast(msg);if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done,()=>fallback());}else fallback();function fallback(){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){prompt('복사해서 쓰세요',txt);}ta.remove();}}
function cartList(){return rows().filter(r=>r.chosen);}
function getOpened(){try{return JSON.parse(LS.gd_opened||'{}')}catch(e){return {}}}
function markOpened(id){const o=getOpened();o[id]=1;LS.gd_opened=JSON.stringify(o);}
function openCart(){const list=cartList();if(!list.length){toast('선택된 품목이 없어요');return;}const op=getOpened();const next=list.find(r=>!op[r.o.id]);const done=list.filter(r=>op[r.o.id]).length;const tt=totals(rows());
 let h=`<h2>쿠팡 장바구니 담기</h2><div class="muted">${list.length}개 · ${won(tt.sum+tt.ship)}</div>
 <h3>방법 1. 하나씩 담기 (폰)</h3><div class="muted">버튼을 누르면 쿠팡이 열려요 → 수량 맞추고 <b>장바구니 담기</b> → 이 화면으로 돌아와서 다음.</div>
 ${next?`<a class="btn big" style="margin-top:10px" target="_blank" href="https://www.coupang.com/vp/products/${next.o.url}" onclick="markOpened('${next.o.id}');setTimeout(openCart,300)">다음 (${done+1}/${list.length}): ${next.o.name.slice(0,18)}… ${next.cnt}개</a>`:`<div class="note" style="margin-top:10px">다 열었어요! 쿠팡 장바구니에서 결제하세요.</div>`}
 <ul class="prog">${list.map(r=>`<li class="${op[r.o.id]?'done':''}">${op[r.o.id]?'✅':'⬜'} <span style="flex:1">${r.o.name} · <b>${r.cnt}개</b></span><a class="btn ghost" target="_blank" href="https://www.coupang.com/vp/products/${r.o.url}" onclick="markOpened('${r.o.id}');setTimeout(openCart,300)">열기</a></li>`).join('')}</ul>
 <button class="btn gray" onclick="LS.gd_opened='{}';openCart()">진행 표시 초기화</button>
 <h3>방법 2. Aside에게 맡기기</h3><div class="muted">목록을 복사해서 피터님께 보내면, Aside가 쿠팡 장바구니에 한 번에 담아요.</div>
 <button class="btn big" style="margin-top:8px" onclick="copyForAside()">목록 복사</button>
 <div class="muted" style="margin-top:12px">쿠팡이 다른 사이트에서 장바구니에 바로 넣는 걸 막고 있어서, 이 화면에서는 버튼 한 번으로 다 담을 수 없어요.</div>`;
 openM(h);}
function copyForAside(){const list=cartList();const txt='쿠팡 장바구니에 담아줘 (글램독 양양 식자재)\n'+list.map(r=>`- ${r.o.name} x${r.cnt} https://www.coupang.com/vp/products/${r.o.url}`).join('\n');copy(txt,'복사됨. 카톡으로 피터님께 보내세요');}
/* ---------- 예산 ---------- */
function monthly(n){const f=n/DATA.basePeople;const cats={};let tot=0;const add=(k,v)=>{cats[k]=(cats[k]||0)+v;tot+=v;};
 for(const o of DATA.order){if(o.g==='opt')continue;if(o.g==='ask')add(o.cat,o.price*o.mon);else if(o.g==='local')add(o.cat,o.price*o.mon*f);else add(o.cat,o.mon*f/o.pack*o.price);}
 add('배송비',28000);return {tot,cats};}
function vBudget(){const goal=1000000,b=monthly(S.people),pp=b.tot/30/S.people,ok=b.tot<=goal;const st=getStock();const tt=totals(rows());
 let h=`<div class="sum3"><div class="card"><div class="muted">한 달 예상 (${S.people}명)</div><div class="big ${ok?'ok':'warn'}">${won(b.tot)}</div><div class="bar"><i style="width:${Math.min(100,b.tot/goal*100)}%;background:${ok?'var(--ok)':'var(--warn)'}"></i></div><div class="muted">목표 100만원의 ${Math.round(b.tot/goal*100)}%</div></div>
 <div class="card"><div class="muted">1인 하루 (세 끼)</div><div class="big">${won(pp)}</div><div class="muted">한 끼 약 ${won(pp/3)}</div></div>
 <div class="card"><div class="muted">인원별 한 달</div>${[6,7,8,9].map(n=>{const x=monthly(n).tot;return `<div>${n}명 <b class="${x<=goal?'ok':'warn'}">${won(x)}</b></div>`}).join('')}</div></div>
 <div class="card"><b>이번 주문 (재고 반영)</b><div class="big" style="font-size:22px">${won(tt.sum+tt.ship)}</div><div class="muted">매주 월요일 주문 · 재고 기준일 ${st.date}. 재고가 있는 만큼 덜 사요.</div></div>`;
 const cs=Object.entries(b.cats).sort((a,c)=>c[1]-a[1]);
 h+=`<div class="card"><b>어디에 쓰나 (한 달, 재고 없이 계산)</b><table class="bt">${cs.map(([k,v])=>`<tr><td style="width:64px">${k}</td><td><div class="bar"><i style="width:${v/cs[0][1]*100}%"></i></div></td><td style="width:90px;text-align:right">${won(v)}</td></tr>`).join('')}</table><div class="muted">양념은 2~3달에 한 번 사니까 한 달 몫으로 나눴어요.</div></div>
 <div class="card"><b>이미 아낀 것</b><ul style="padding-left:18px;margin:6px 0">
 <li>쌀: 일반 햅쌀 20kg 59,500원 → 싸래기쌀 28,990원 (월 약 -6만원)</li>
 <li>닭: 12kg 박스 → 2kg씩 필요한 만큼만</li><li>냉장·냉동은 매주 1주일 치만 (냉장고 공간 절약)</li><li>만두: CJ → 사조오양 대용량 (100g당 890원 → 419원)</li><li>김·코코볼은 선택으로 빼기</li></ul>
 <b>더 아끼려면</b><ol style="padding-left:20px;margin:6px 0"><li>계란 5판 → 3판, 계란말이 대신 감자볶음: 월 약 -2.5만원</li><li>삼겹살 구이 2번 → 1번 (나머지는 제육): 월 약 -1만원</li><li>잼은 2달에 한 번: 월 약 -7천원</li></ol>
 <div class="note">매점용 과자·음료·물·라면은 이 예산에 넣지 않았어요.</div></div>`;
 return h;}
/* ---------- 공통 ---------- */
const TABS=[['today','🍽'],['menu','📅'],['recipes','📖'],['order','🛒'],['budget','💰']];
function render(keep){document.getElementById('tabs').innerHTML=TABS.map(([k,i])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')"><i>${i}</i>${t(k)}</button>`).join('');
 document.getElementById('people').innerHTML=[4,5,6,7,8,9,10].map(n=>`<option value="${n}" ${S.people===n?'selected':''}>${n}${t('people')}</option>`).join('');
 document.querySelectorAll('#lang button').forEach(b=>{b.classList.toggle('on',b.dataset.v===S.lang);b.onclick=()=>{S.lang=b.dataset.v;LS.gd_lang=S.lang;render();}});
 const el=document.getElementById('view');const y=window.scrollY;const a=document.activeElement;const pos=a&&a.tagName==='INPUT'&&a.type==='text'||a&&a.placeholder&&a.placeholder.startsWith('🔍')?a.selectionStart:null;
 el.innerHTML={today:vToday,menu:vMenu,recipes:vRecipes,order:vOrder,budget:vBudget}[S.tab]();sumbar();
 if(keep)window.scrollTo(0,y);
 if(pos!==null&&S.tab==='recipes'){const i=el.querySelector('.filters input');i.focus();i.setSelectionRange(pos,pos);}}
function go(k){S.tab=k;LS.gd_tab=k;render();window.scrollTo(0,0);}
document.getElementById('people').onchange=e=>{S.people=+e.target.value;LS.gd_people=S.people;render(true);};
if(location.hash.startsWith('#s=')){try{const st=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(location.hash.slice(3))))));LS.gd_stock=JSON.stringify(st);LS.gd_sel='{}';S.tab='order';history.replaceState(null,'',location.pathname);setTimeout(()=>toast('공유받은 재고를 불러왔어요 ('+st.date+')'),300);}catch(e){}}
render();
</script>
</body>
