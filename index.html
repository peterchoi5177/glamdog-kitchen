<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글램독 양양 주방 가이드</title>
<style>
:root{--acc:#e8772e;--acc2:#fff3ea;--ink:#222;--sub:#666;--line:#e7e2dc;--bg:#faf8f5;--ok:#2f8f5b;--warn:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.5}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap}
.top h1 span{color:var(--acc)}
.ctl{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--sub)}
.seg button{border:1px solid var(--line);background:#fff;padding:5px 10px;font-size:14px;cursor:pointer}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
nav{display:flex;overflow-x:auto;padding:0 8px}
nav button{border:0;background:none;padding:10px 12px;font-size:15px;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.muted{color:var(--sub);font-size:14px}
.datebar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.datebar button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-size:18px;cursor:pointer}
.datebar .d{flex:1;text-align:center}
.datebar .d b{font-size:22px;display:block}
.meals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.meals{grid-template-columns:1fr}}
.meal h3{margin:0 0 8px;font-size:15px;color:var(--sub);font-weight:600}
.meal .main{font-size:22px;font-weight:800;margin-bottom:6px}
.chip{display:inline-block;background:var(--acc2);color:#a24c12;border-radius:999px;padding:3px 10px;font-size:14px;margin:2px 4px 2px 0;cursor:pointer;border:1px solid #f6d6bf}
.chip.side{background:#f1f5f2;color:#2f6b4a;border-color:#d6e6dc}
.rlink{cursor:pointer;text-decoration:underline;text-decoration-color:#f0b48a;text-underline-offset:4px}
.todo{border-left:5px solid var(--acc)}
.todo li{margin:4px 0}
table{border-collapse:collapse;width:100%}
.mt{table-layout:fixed}.mt th,.mt td{border:1px solid var(--line);padding:6px;vertical-align:top;font-size:13.5px}
.mt th{background:#f6f1eb;font-weight:700}
.mt td.lab{background:#fbf8f4;font-weight:700;white-space:nowrap;width:44px;text-align:center}
.mt td.today{background:#fff3ea;outline:2px solid var(--acc);outline-offset:-2px}
.mt .m1{font-weight:700;cursor:pointer}
.mt .m2{color:var(--sub);font-size:12.5px;cursor:pointer}
.wk{font-size:16px;margin:18px 0 8px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.rc:hover{border-color:var(--acc)}
.rc b{font-size:17px}
.tag{font-size:12px;border-radius:6px;padding:1px 6px;margin-left:6px;background:#eee;color:#555}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters input{flex:1;min-width:160px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:15px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;padding:20px 10px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;max-width:640px;width:100%;padding:20px;position:relative}
.mbox h2{margin:0 0 4px}
.x{position:absolute;right:14px;top:10px;font-size:26px;border:0;background:none;cursor:pointer}
.ing{columns:2;padding-left:18px}
@media(max-width:520px){.ing{columns:1}}
.ing li{break-inside:avoid}
.steps li{margin:8px 0;font-size:17px}
.thaw{background:#eef6ff;border:1px solid #cfe3fb;border-radius:10px;padding:8px 10px;font-size:14px;margin:10px 0}
.ot td,.ot th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;font-size:14px;vertical-align:middle}
.ot th{color:var(--sub);font-weight:600;font-size:13px}
.ot tr.done td{opacity:.45;text-decoration:line-through}
.ot .num{text-align:right;white-space:nowrap}
.btn{display:inline-block;background:var(--acc);color:#fff;border-radius:8px;padding:4px 10px;text-decoration:none;font-size:13px;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--acc);border:1px solid var(--acc)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:640px){.sum{grid-template-columns:1fr}}
.big{font-size:28px;font-weight:800}
.bar{height:12px;background:#eee;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.ok{color:var(--ok)}.warn{color:var(--warn)}
.bt td{padding:6px 4px;border-bottom:1px solid var(--line);font-size:14px}
.note{background:#fffbe6;border:1px solid #f3e3a1;border-radius:10px;padding:10px 12px;font-size:14px}
.printbtn{float:right}
@media print{header,.noprint,.printbtn{display:none!important}main{padding:0;max-width:none}.card{border:0;padding:0}.mt th,.mt td{font-size:13px;padding:4px}.mt td.lab{width:48px}.wk{margin:6px 0 4px}body{background:#fff}.page{page-break-after:always}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>글램독 양양 <span>주방 가이드</span></h1>
    <div class="ctl"><span id="lbl-people">인원</span>
      <div class="seg" id="people"></div></div>
    <div class="ctl"><div class="seg" id="lang"><button data-v="ko">한국어</button><button data-v="en">English</button></div></div>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="view"></main>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<script>

// 재료 영어명
en: {'돼지 앞다리 슬라이스':'Sliced pork shoulder','찌개용 돼지고기':'Pork chunks (stew cut)','닭다리살':'Boneless chicken thigh','삼겹살':'Pork belly','돼지 다짐육':'Ground pork',
 '양파':'Onion','양배추':'Cabbage','대파(냉동)':'Green onion (frozen)','당근':'Carrot','감자':'Potato','애호박':'Zucchini','콩나물':'Bean sprouts','두부':'Tofu','김치':'Kimchi',
 '고추장':'Gochujang (red pepper paste)','고춧가루':'Red pepper flakes','간장':'Soy sauce','설탕':'Sugar','다진마늘':'Minced garlic','식용유':'Cooking oil','참기름':'Sesame oil','후추':'Black pepper','소금':'Salt','된장':'Doenjang (soybean paste)','물':'Water',
 '당면':'Glass noodles','떡볶이떡':'Rice cakes (tteok)','카레가루':'Curry powder','짜장가루':'Jjajang powder','밥':'Cooked rice','런천미트':'Luncheon meat (Spam)','계란':'Eggs','참치':'Tuna (can)','마요네즈':'Mayonnaise','김(도시락김)':'Seaweed snack packs',
 '비엔나소시지':'Mini sausages','어묵':'Fish cake','물만두':'Dumplings','감자전분':'Potato starch','쌈장':'Ssamjang (dipping paste)','건미역':'Dried seaweed (miyeok)','라면사리(선택)':'Ramen noodles (optional)'},
recipes: {
 jeyuk: {ko:'제육볶음', en:'Spicy Pork Stir-fry', type:'main', min:25, thaw:'돼지 앞다리 슬라이스 1.2kg',
  ing:[['돼지 앞다리 슬라이스',1200,'g'],['양파',2,'개'],['양배추',400,'g'],['대파(냉동)',1,'컵'],['고추장',5,'큰술'],['고춧가루',3,'큰술'],['간장',4,'큰술'],['설탕',3,'큰술'],['다진마늘',2,'큰술'],['식용유',2,'큰술']],
  ko_steps:['큰 볼에 고기 + 고추장·고춧가루·간장·설탕·마늘을 넣고 손으로 주물러 10분 둔다.','큰 팬(웍)에 기름을 두르고 센 불에서 고기를 7~8분 볶는다.','양파·양배추(한입 크기)를 넣고 5분 더 볶는다.','대파 넣고 1분. 불 끄면 끝.'],

 bulgogi: {ko:'간장 돼지불고기', en:'Soy Garlic Pork (Bulgogi)', type:'main', min:25, thaw:'돼지 앞다리 슬라이스 1.2kg',

 kimchijjigae: {ko:'김치찌개', en:'Kimchi Stew', type:'main', min:30, thaw:'찌개용 돼지고기 400g',

  ko_steps:['큰 냄비에 기름, 고기 넣고 3분 → 김치 넣고 5분 볶는다.','물 2L, 고춧가루·마늘·설탕 넣고 뚜껑 덮고 20분 끓인다.','두부(주사위 크기)·양파 넣고 5분.','대파 넣고 끝. 싱거우면 김치국물이나 소금 조금.'],

 curry: {ko:'카레라이스 (돼지)', en:'Curry Rice (pork)', type:'main', min:35, thaw:'찌개용 돼지고기 450g',

  ko_steps:['고기·감자·당근·양파를 주사위 크기로 썬다.','냄비에 기름, 고기 3분 → 채소 넣고 3분 볶는다.','물 넣고 15분 끓인다.','불을 약하게. 카레가루를 찬물 2컵에 풀어 넣고 5분 저어준다 (바닥 안 눌게).'],
  en_steps:['Dice pork, potato, carrot, onion.','Pot + oil: pork 3 min, then vegetables 3 min.','Add water, boil 15 min.','LOW heat. Mix curry powder in 2 cups cold water, pour in, stir 5 min (don\'t let it burn).']},

 const um={'큰술':'Tbsp','작은술':'tsp','컵':'cup','개':'pcs','공기':'bowls','봉':'packs','통':'tub','g':'g','L':'L','ml':'ml'};

function pk(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+(d.getDate()<15?'a':'b');}
function vOrder(){const f=S.people/DATA.basePeople;const ck=JSON.parse(localStorage['gd_ck_'+pk()]||'{}');
 let h=`<div class="note"><b>주문 방법 (처음 한 번만 조금 번거로워요)</b><ol style="margin:6px 0 0;padding-left:20px"><li>①+② 목록의 "쿠팡" 버튼을 눌러 하나씩 장바구니에 담고 결제.</li><li>다음부터는 쿠팡 <b>마이쿠팡 → 다시 구매</b>에서 지난 주문을 그대로 담으면 1~2분이면 끝.</li><li>담은 건 왼쪽 체크. 체크는 이 기기에 저장되고, 1일·15일마다 새로 시작돼요.</li></ol><div class="muted" style="margin-top:6px">가격은 ${DATA.priceDate} 쿠팡 검색 기준이라 조금씩 바뀌어요. 품절이면 같은 종류 중 100g당 가격이 비슷한 걸로.</div></div>`;
 for(const g of ['2w','1m','ask','local']){const items=DATA.order.map((o,i)=>({...o,i})).filter(o=>o.g===g);let sub=0;
  h+=`<div class="card"><h3 style="margin:0">${G[g].t}</h3><div class="muted">${G[g].d}</div><table class="ot"><tr><th></th><th>품목</th><th class="num">수량</th><th class="num">가격</th><th></th></tr>`;
  for(const o of items){const qBase=o.qty||1;const q=o.scale&&g!=='ask'?Math.max(1,Math.round(qBase*f*2)/2):qBase;const qq=Math.ceil(q);const cost=o.price*qq;sub+=g==='ask'?0:cost;const on=ck[o.i];
   h+=`<tr class="${on?'done':''}"><td><input type="checkbox" ${on?'checked':''} onchange="tick(${o.i},this.checked)"></td><td>${o.name}${o.note?`<div class="muted">${o.note}</div>`:''}</td><td class="num">${qq}개${q!==qBase&&o.scale?'<div class="muted">('+S.people+'명)</div>':''}</td><td class="num">${won(cost)}</td><td>${o.url?`<a class="btn" target="_blank" href="https://www.coupang.com/vp/products/${o.url}">쿠팡</a>`:''}</td></tr>`;}
  h+=`</table>${g==='ask'?'':`<div style="text-align:right;margin-top:8px"><b>합계 ${won(sub)}</b> <span class="muted">(1회 주문)</span></div>`}</div>`;}
 return h;}
function tick(i,v){const k='gd_ck_'+pk();const c=JSON.parse(localStorage[k]||'{}');c[i]=v;localStorage[k]=JSON.stringify(c);render(true);}
function budget(n){const f=n/DATA.basePeople;const cats={};let tot=0;for(const o of DATA.order){const c=o.price*o.m*(o.scale?f:1);cats[o.cat]=(cats[o.cat]||0)+c;tot+=c;}cats['배송비 여유']=8000;tot+=8000;return {tot,cats};}
function vBudget(){const goal=1000000;const b=budget(S.people);const pp=b.tot/30/S.people;const ok=b.tot<=goal;
 let h=`<div class="sum"><div class="card"><div class="muted">한 달 예상 (${S.people}명)</div><div class="big ${ok?'ok':'warn'}">${won(b.tot)}</div><div class="bar"><i style="width:${Math.min(100,b.tot/goal*100)}%;background:${ok?'var(--ok)':'var(--warn)'}"></i></div><div class="muted">목표 100만원의 ${Math.round(b.tot/goal*100)}%</div></div>
 <div class="card"><div class="muted">1인 하루 (세 끼)</div><div class="big">${won(pp)}</div><div class="muted">한 끼 평균 약 ${won(pp/3)}</div></div>
 <div class="card"><div class="muted">인원별 비교</div>${[6,7,8].map(n=>{const x=budget(n).tot;return `<div>${n}명 <b class="${x<=goal?'ok':'warn'}">${won(x)}</b></div>`}).join('')}</div></div>`;
 const cs=Object.entries(b.cats).sort((a,b)=>b[1]-a[1]);
 h+=`<div class="card"><h3 style="margin-top:0">어디에 쓰나 (한 달)</h3><table class="bt">${cs.map(([k,v])=>`<tr><td style="width:90px">${k}</td><td><div class="bar"><i style="width:${v/cs[0][1]*100}%"></i></div></td><td class="num" style="width:100px;text-align:right">${won(v)}</td></tr>`).join('')}</table><div class="muted">양념은 2~3달에 한 번 사니까 한 달 몫으로 나눠서 계산했어요. 첫 달은 양념을 한꺼번에 사서 7~8만원 더 나올 수 있어요.</div></div>`;
 h+=`<div class="card"><h3 style="margin-top:0">예산이 넘을 것 같을 때 (효과 큰 순서)</h3><ol>
 <li>삼겹살 5kg(54,500원) 대신 제육용 앞다리 3kg(31,200원) 한 번 더. 바베큐도 앞다리·목전지로: 약 -2.3만원</li>
 <li>계란 5판 → 3판(2주마다), 계란말이 대신 감자볶음: 약 -2.5만원</li>
 <li>도시락김 빼기, 잼은 2달에 한 번: 약 -2.5만원</li></ol>
 <div class="note">8명이 계속 먹으면 약 ${won(budget(8).tot)}로 100만원을 넘어요. 그때는 위 1~3번을 모두 하면 약 104만원까지 내려가요. 매점용 과자·음료·물·라면은 이 예산에 넣지 않았어요.</div></div>`;
 return h;}
const tabs=['today','menu','recipes','order','budget'];
function render(keep){document.getElementById('tabs').innerHTML=tabs.map(k=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';render()">${t(k)}</button>`).join('');
 document.getElementById('people').innerHTML=[5,6,7,8,9].map(n=>`<button class="${S.people===n?'on':''}" onclick="S.people=${n};localStorage.gd_people=${n};render()">${n}</button>`).join('');
 document.getElementById('lbl-people').textContent=t('people');
 document.querySelectorAll('#lang button').forEach(b=>{b.classList.toggle('on',b.dataset.v===S.lang);b.onclick=()=>{S.lang=b.dataset.v;localStorage.gd_lang=S.lang;render();}});
 const v={today:vToday,menu:vMenu,recipes:vRecipes,order:vOrder,budget:vBudget}[S.tab]();
 const el=document.getElementById('view');const a=document.activeElement;const pos=a&&a.tagName==='INPUT'&&a.type!=='checkbox'?a.selectionStart:null;el.innerHTML=v;
 if(pos!==null&&S.tab==='recipes'){const i=el.querySelector('.filters input');i.focus();i.setSelectionRange(pos,pos);}}
render();
</script>
</body>
</html>
